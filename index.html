<main class="shell">

<section id="home" class="catalog"><p class="tag">好友免费体验</p><h1>今天，想测点什么？</h1><p class="intro">选一个主题，走过 10 个小场景，收一张属于你的彩色明信片。</p><div id="themeGrid" class="theme-grid"></div></section>

<script>
const travelQuestions = [
 ['出发前夜','群里只定了目的地，明早就要出发。你先做什么？','把车次、住址和集合时间放进群公告','找一站没去过的小镇，提议顺路下车','问清谁容易晕车，给对方留个靠前的位置','拍下大家乱成一团的行李，做相册封面'],
 ['刚刚到站','离入住还有两小时，你想拿这段空当做什么？','找好寄存柜，顺便摸清回酒店的路','钻进出站口那条飘着葱油香的小巷','找个能坐下吃面、还能给手机充电的地方','去月台尽头，给每个人拍一张抵达照'],
 ['突遇阵雨','山路突然下起雨，原计划走不成了。你说什么？','“室内展馆有空档，我查下末班车。”','“听见没，隔壁屋檐下有人弹琴，去听听？”','“谁鞋湿了？先坐五分钟，我包里有干袜子。”','“雨在棚顶的声音真好听，我录一小段。”'],
 ['午饭时间','点菜时四个人都说随便。你怎么接？','圈出三道招牌，按人数算好分量','指着隔壁桌那盘叫不出名字的菜问老板','先问有没有忌口，再把菜单递给最饿的人','让大家各给一道菜起外号，写在小票背面'],
 ['山路半程','步道岔口，有人走累了，有人还想上山。你会先……','看路标，找出两队都能按时集合的地点','走一小段旁边的岔道，看看有没有近处的风景','留下来陪走累的朋友，慢慢吃完一只橘子','把手机架在石头上，趁大家还在拍张合照'],
 ['夜市走散','逛夜市时，你和朋友走散了。发完定位，你还会……','约在固定摊位碰头，告诉大家招牌颜色','去旁边围满本地人的摊位打听卖的是什么','问对方电量还剩多少，要不要过去接','拍下头顶那盏鱼形灯，留作这晚的记号'],
 ['清晨散步','比约定早醒了一小时。你拿起房卡去哪？','踩一遍去码头的路，记下最方便的入口','跟着第一辆送菜车，找找早市在哪','给还没起床的人带两份早餐，酱料分开','等天空亮一格，拍下街灯熄灭的瞬间'],
 ['临时加站','车窗外闪过一片花田，朋友说真想下去。你会……','看好回程班次，算算停半小时来不来得及','在下一站下车，问问当地人哪条路能走过去','先看看谁想留在车上，陪对方一起选','把窗上的倒影和花田拍在同一张照片里'],
 ['返程之前','回家前还有一小时，你最愿意用来做什么？','把散在大家手里的票据理清，把账结了','往还没走过的那条街再拐一个弯','给一路帮忙拎包的朋友买杯喜欢的饮料','在车站写张明信片，记下这一路最好笑的话'],
 ['旅行结束','朋友提起这趟旅行，你最想听到哪一句？','“照着你发的那张图，我们一次车都没误。”','“跟你多拐的那条街，成了我最喜欢的地方。”','“那天我有点撑不住，幸好你看出来了。”','“你录的那段叫卖声一响，我就又回到那天了。”']
];
const travelRoles=[
 {name:'行程掌舵人',tag:'全团都说随缘，最后都来找你要行程表。',read:'你会把模糊的约定变成能照着走的小事。朋友敢在路上发呆，多半因为知道你记得回程车在哪一站。',tip:'下次把一个下午留白，也让别人给你带一次路。',sky:'#e4ad69',hill:'#698979',ink:'#245448'},
 {name:'拐弯探路员',tag:'导航说直走，你闻着葱油香拐了个弯。',read:'别人记住地标，你记住地标背后那条街。你愿意先开口、先探路，让同行人遇见攻略之外的小事。',tip:'临时加站前约个集合点，喜欢慢走的朋友也能放心跟上。',sky:'#e8a477',hill:'#ad7156',ink:'#684537'},
 {name:'随队补给站',tag:'你包里的最后一颗糖，总有人刚好需要。',read:'你会留意一句突然变少的话、一个慢下来的脚步。跟你同行的人知道，累了开口就能歇一会儿。',tip:'点餐时第一个说出你想吃的菜，也给朋友照顾你的机会。',sky:'#e9c782',hill:'#7b926b',ink:'#3d5a3c'},
 {name:'沿途收集员',tag:'别人带回纪念品，你带回整条街的声音。',read:'你会替一段旅程留住气味、笑话和傍晚的光。散团以后，是你的小相册让大家又坐回同一节车厢。',tip:'挑一个瞬间把手机交给别人，让你也出现在旅行记录里。',sky:'#d2afbc',hill:'#9186a0',ink:'#494b60'}
];
const get=id=>document.getElementById(id);
let answers=[],page=0;

const themes = [
 {key:'travel',title:'你是哪种旅行搭子？',label:'旅行搭子',intro:'离入住还有两小时，你先寄存行李，还是循着葱油香拐进小巷？',cover:3,questions:travelQuestions,roles:travelRoles},
 chatTheme, shopTheme
];
let theme = themes[0], questions = theme.questions, roles = theme.roles;
let activePoster = 0;
function artUrl(key, type) { return 'art/' + key + '-' + type + '.webp'; }
function selectTheme(item) {
 theme = item;
 questions = item.questions;
 roles = item.roles;
 get('paperImage').removeAttribute('src');
 get('paperSave').removeAttribute('href');
}
function home() {
 activePoster++;
 show('home');
 document.querySelector('[data-theme="' + theme.key + '"]').focus({preventScroll:true});
}
for (const item of themes) {
 const tile = document.createElement('article');
 tile.className = 'tile';
 tile.innerHTML = '<img alt="" width="358" height="358"><div class="tile-body"><h2></h2><p></p><div class="tile-actions"><button class="action">开始答题</button><button class="paper-link">微信长图</button></div></div>';
 tile.querySelector('img').src = artUrl(item.key, item.cover);
 tile.querySelector('h2').textContent = item.title;
 tile.querySelector('p').textContent = item.intro;
 const launch = tile.querySelector('.action');
 launch.dataset.theme = item.key;
 launch.setAttribute('aria-label', '开始答题：' + item.label);
 launch.onclick = () => { selectTheme(item); start(); };
 tile.querySelector('.paper-link').setAttribute('aria-label', '微信长图：' + item.label);
 tile.querySelector('.paper-link').onclick = () => { selectTheme(item); openPaper(); };
 get('themeGrid').append(tile);
}
function show(id){for(const key of ['home','quiz','result','paperPanel'])get(key).hidden=key!==id;window.scrollTo(0,0)}
function drawQuestion(){
 show('quiz');const q=questions[page];get('scene').textContent=theme.label+' · '+q[0];get('count').textContent=String(page+1).padStart(2,'0')+' / 10';get('bar').style.width=((page+1)*10)+'%';
 get('question').textContent=q[1];get('options').replaceChildren();get('back').disabled=page===0;get('next').textContent=page===9?'查看结果':'下一题';
 for(let i=0;i<4;i++){const type=(i+page)%4,b=document.createElement('button');b.className='option';b.dataset.type=type;const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];b.append(l,document.createTextNode(q[2+type]));b.onclick=()=>{answers[page]=type;highlight()};get('options').append(b)}
 highlight();get('question').focus({preventScroll:true})
}
function highlight(){for(const b of get('options').children)b.setAttribute('aria-pressed',Number(b.dataset.type)===answers[page]?'true':'false');get('next').disabled=answers[page]===undefined}
function winner(choices){const score=[0,0,0,0];for(const a of choices)score[a]++;const high=Math.max(...score);return choices.slice().reverse().find(a=>score[a]===high)}
async function makeCard(type) {
 const request = ++activePoster;
 const item = theme, role = roles[type];
 const image = new Image();
 image.src = artUrl(item.key,type);
 get('card').hidden = true;
 get('save').hidden = true;
 get('artStatus').hidden = true;
 try {
   await image.decode();
   if (request !== activePoster) return;
   const canvas = document.createElement('canvas');
   canvas.width = 800; canvas.height = 1110;
   const c = canvas.getContext('2d');
   c.fillStyle = '#fff3d8'; c.fillRect(0,0,800,1110);
   c.fillStyle = role.ink;
   c.font = 'bold 26px sans-serif'; c.fillText('旅途邮局   /   '+item.label,38,55);
   c.font = 'bold 75px serif'; c.fillText(role.name,32,148,736);
   c.drawImage(image, 0,179,800,800);
   c.fillStyle = role.ink; c.fillRect(0,979,800,131);
   c.fillStyle = '#fff9de'; c.font = 'bold 32px sans-serif';
   const lines = [''];
   for (const ch of role.tag) {
     if (c.measureText(lines[lines.length-1]+ch).width > 722) lines.push('');
     lines[lines.length-1] += ch;
   }
   const top = lines.length === 1 ? 1055 : 1037;
   lines.forEach((line,i) => c.fillText(line,39,top+i*45));
   const url = canvas.toDataURL('image/png');
   get('card').src = url; get('card').alt = role.name+'。'+role.tag; get('card').hidden = false;
   get('save').href = url; get('save').download = role.name+'-'+item.label+'.png'; get('save').hidden = false;
 } catch {
   if (request === activePoster) get('artStatus').hidden = false;
 }
}
function finish(){const type=winner(answers),r=roles[type];show('result');get('role').textContent=r.name;get('reading').textContent=r.read;get('resultLabel').textContent=theme.label+' · 你的结果明信片';get('tip').textContent='给你的建议：'+r.tip;const details=answers.flatMap((a,i)=>a===type?[i]:[]).slice(0,2);
 get('proof').textContent='你在测试中的选择：'+details.map(i=>'「'+questions[i][0]+'」时，你选了“'+questions[i][2+type].replace(/^[“]|[”]$/g,'')+'”').join('；')+'。';
 makeCard(type);get('role').focus({preventScroll:true})}
function start(){answers=[];page=0;drawQuestion()}
get('otherTheme').onclick=home;get('exitQuiz').onclick=home;get('retryArt').onclick=()=>makeCard(winner(answers));get('restart').onclick=start;get('back').onclick=()=>{if(page>0){page--;drawQuestion()}};get('next').onclick=()=>{if(answers[page]===undefined)return;if(page===9)finish();else{page++;drawQuestion()}};
// Lay out the printable game from the same questions and roles as the interactive version.
function makePaperGame() {
 const width = 1080, margin = 64, area = width - 2 * margin;
 const canvas = document.createElement('canvas');
 canvas.width = width;
 const ctx = canvas.getContext('2d');
 const rows = [];
 let y = 0;
 function write(text, size, weight, color, x = margin, maxWidth = area) {
   const font = weight + ' ' + size + 'px "Microsoft YaHei", sans-serif';
   ctx.font = font;
   let line = '';
   function appendLine() {
     rows.push({text:line, font, color, x, y});
     y += Math.ceil(size * 1.4);
   }
   for (const ch of text) {
     if (line && ctx.measureText(line + ch).width > maxWidth) { appendLine(); line = ''; }
     line += ch;
   }
   if (line) appendLine();
 }
 y = 50;
 write('旅途邮局     /     好友免费体验', 26, 700, '#ffe7af');
 y += 16;
 write(theme.title, 66, 800, '#fff9ed');
 y += 9;
 write('每题记下一个字母。答完 10 题，到图底揭晓身份。', 32, 500, '#fff9ed');
 const headerHeight = y + 37;
 y = headerHeight + 34;
 const rules = [];
 questions.forEach((q,i) => {
   write(String(i+1).padStart(2,'0') + '   /   ' + q[0], 27, 700, '#9a422c');
   write(q[1], 39, 700, '#143e36');
   y += 8;
   for (let type = 0; type < 4; type++) {
     write('ABCD'[type] + '   ' + q[2+type], 32, 400, '#263d38');
     y += 5;
   }
   y += 14;
   rules.push(y);
   y += 26;
 });
 const resultsTop = y - 18;
 y += 18;
 write('打开你的结果明信片', 54, 750, '#fff9ed');
 y += 8;
 write('出现最多的字母就是你的身份。如并列，从第 10 题倒着看，最先遇到的并列字母获胜。', 31, 500, '#f5e7c9');
 y += 21;
 roles.forEach((role,i) => {
   write('ABCD'[i] + '    ' + role.name, 40, 700, '#ffcf81');
   write(role.tag, 32, 400, '#fff9ed');
   y += 13;
 });
 canvas.height = y + 30;
 ctx.fillStyle = '#fbf5e8'; ctx.fillRect(0,0,width,canvas.height);
 ctx.fillStyle = '#184c42'; ctx.fillRect(0,0,width,headerHeight);
 ctx.fillRect(0,resultsTop,width,canvas.height-resultsTop);
 ctx.fillStyle = '#cabba6'; rules.forEach(at => ctx.fillRect(margin,at,area,2));
 ctx.textBaseline = 'top';
 for (const row of rows) {
   ctx.font = row.font; ctx.fillStyle = row.color; ctx.fillText(row.text,row.x,row.y);
 }
 return canvas.toDataURL('image/png');
}
function openPaper() {
 get('paperTitle').textContent = theme.label + ' · 微信图片版';
 get('paperSave').download = theme.label+'-微信答题长图.png';
 get('paperImage').alt = theme.label+'十道选择题及四种结果';
 if (!get('paperImage').hasAttribute('src')) {
   const url = makePaperGame();
   get('paperImage').src = url;
   get('paperSave').href = url;
 }
 get('home').hidden = true;
 get('paperPanel').hidden = false;
 get('paperTitle').focus();
 window.scrollTo(0,0);
};
get('paperClose').onclick = () => {
 get('paperPanel').hidden = true;
 show('home');
 home();
};
</script>
